<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Цветовед</title>
<style>
:root{--bg:#f2f2f7;--card:rgba(255,255,255,.66);--line:rgba(60,60,67,.14);--tx:#111114;--tx2:rgba(60,60,67,.62);--ac:#0a84ff;--ac2:#bf5af2;--sh:0 10px 40px rgba(20,20,60,.12);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:rgba(44,44,48,.62);--line:rgba(255,255,255,.14);--tx:#fff;--tx2:rgba(235,235,245,.6);--sh:0 10px 40px rgba(0,0,0,.5);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:-apple-system,"SF Pro Display","SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-20%;z-index:0;background:radial-gradient(40% 35% at 15% 10%,rgba(10,132,255,.28),transparent 70%),radial-gradient(35% 35% at 90% 20%,rgba(191,90,242,.24),transparent 70%),radial-gradient(40% 40% at 70% 95%,rgba(255,159,10,.2),transparent 70%)}
#app{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.view{display:none;flex:1;min-height:0;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 150px}
.view.on{display:flex;flex-direction:column}
h1{font-size:34px;line-height:1.1;letter-spacing:-.8px;font-weight:800;margin:10px 4px 4px}
.sub{color:var(--tx2);font-size:15px;margin:0 4px 16px}
.glass{background:var(--card);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);border:1px solid var(--line);box-shadow:var(--sh)}
#stage{position:relative;flex:1;min-height:300px;max-height:68dvh;border-radius:34px;overflow:hidden;background:#0b0b0f;box-shadow:var(--sh)}
#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#frame{position:absolute;left:50%;top:50%;display:none;cursor:crosshair;touch-action:manipulation}
#frame canvas{width:100%;height:100%;display:block}
#stage[data-mode=photo] #vid{display:none}#stage[data-mode=photo] #frame{display:block}
.mk{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.5),0 4px 12px rgba(0,0,0,.4);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.mk.sel{transform:scale(1.35)}
#hint{position:absolute;top:14px;left:50%;transform:translateX(-50%);padding:8px 14px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--tx)}
#err{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:28px;text-align:center;color:#fff}
#err b{font-size:19px}#err span{opacity:.75;font-size:14px;line-height:1.4}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:fl .35s}@keyframes fl{from{opacity:.9}to{opacity:0}}
.ctrl{display:flex;align-items:center;justify-content:space-between;padding:18px 26px 0}
.rb{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:var(--tx);cursor:pointer;border:1px solid var(--line)}
.rb svg{width:24px;height:24px}
#shutter{width:78px;height:78px;border-radius:50%;border:4px solid var(--tx);background:transparent;padding:5px;cursor:pointer;transition:transform .15s}
#shutter:active{transform:scale(.92)}
#shutter i{display:block;width:100%;height:100%;border-radius:50%;background:var(--tx);transition:border-radius .25s,transform .25s}
#shutter.retake i{border-radius:14px;transform:scale(.62)}
#sheet{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);width:min(524px,calc(100% - 28px));transform:translate(-50%,160%);transition:transform .45s cubic-bezier(.2,.9,.25,1.05);border-radius:30px;padding:16px;z-index:5}
#sheet.up{transform:translate(-50%,0)}
.row{display:flex;gap:14px;align-items:center}
#sw{width:64px;height:64px;border-radius:20px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14),0 6px 18px rgba(0,0,0,.18)}
#nm{font-size:24px;font-weight:800;letter-spacing:-.4px;line-height:1.15}
#vals{font-size:14px;color:var(--tx2);margin-top:3px;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px;margin-top:14px;align-items:center}
.pill{border:0;border-radius:99px;padding:11px 18px;font-weight:600;font-size:15px;font-family:inherit;cursor:pointer;background:var(--ac);color:#fff}
.pill.g{background:rgba(120,120,128,.18);color:var(--tx)}
.chips{display:flex;gap:7px;margin-left:auto}
.chip{width:26px;height:26px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px rgba(0,0,0,.2);cursor:pointer}
.chip.sel{border-color:var(--ac)}
#tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(300px,calc(100% - 40px));display:flex;padding:6px;border-radius:99px;z-index:6}
.tab{flex:1;border:0;background:none;border-radius:99px;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;font-size:11px;font-family:inherit;color:var(--tx2);cursor:pointer;transition:background .25s,color .25s}
.tab svg{width:24px;height:24px}
.tab.on{background:rgba(120,120,128,.2);color:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hc{border-radius:26px;overflow:hidden;position:relative;cursor:pointer}
.hc .ph{aspect-ratio:1/1;background-size:cover;background-position:center}
.hc .in{padding:10px 12px 12px}
.hc .dt{font-size:12px;color:var(--tx2);margin-bottom:7px}
.sws{display:flex;gap:5px;flex-wrap:wrap}.sws i{width:20px;height:20px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.hc .nms{font-size:13px;font-weight:600;margin-top:7px;line-height:1.3}
.del{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:0;color:var(--tx);display:grid;place-items:center;cursor:pointer;font-size:18px;line-height:1}
.empty{margin:auto;text-align:center;color:var(--tx2);max-width:260px;line-height:1.45}
.empty b{display:block;color:var(--tx);font-size:19px;margin-bottom:6px}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translate(-50%,-90px);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;z-index:9;transition:transform .35s cubic-bezier(.2,.9,.25,1.1)}
#toast.on{transform:translate(-50%,0)}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <section class="view on" id="v-cam">
    <h1>Цветовед</h1>
    <p class="sub">Сфотографируйте предмет и нажмите на нужное место: назову цвет.</p>
    <div id="stage" data-mode="live">
      <video id="vid" autoplay playsinline muted></video>
      <div id="frame"><canvas id="cv"></canvas><div id="marks"></div></div>
      <div id="hint" class="glass" hidden>Нажмите на любую точку фото</div>
      <div id="err" hidden><b>Нет доступа к камере</b><span>Разрешите камеру в браузере или выберите готовое фото кнопкой слева.</span></div>
      <div id="flash"></div>
    </div>
    <div class="ctrl">
      <label class="rb glass" title="Выбрать фото"><input id="file" type="file" accept="image/*" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg></label>
      <button id="shutter" aria-label="Сделать снимок"><i></i></button>
      <button class="rb glass" id="flip" title="Сменить камеру"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><path d="M9.5 13.5a2.5 2.5 0 0 1 4.3-1.7M14.5 14.5a2.5 2.5 0 0 1-4.3 1.7"/></svg></button>
    </div>
  </section>
  <section class="view" id="v-his">
    <h1>История</h1>
    <p class="sub" id="hsub"></p>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden><b>Пока пусто</b>Сделайте снимок и нажмите на цвет. Результат сохранится здесь.</div>
    <div class="btns" style="justify-content:center;margin-top:20px"><button class="pill g" id="clear" hidden>Очистить историю</button></div>
  </section>
  <div id="sheet" class="glass">
    <div class="row"><div id="sw"></div><div><div id="nm"></div><div id="vals"></div></div></div>
    <div class="btns"><button class="pill" id="copy">Копировать</button><div class="chips" id="chips"></div></div>
  </div>
  <nav id="tabs" class="glass">
    <button class="tab on" data-t="cam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg>Камера</button>
    <button class="tab" data-t="his"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>История</button>
  </nav>
  <div id="toast" class="glass"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const NAMES="Белый:255,255,255;Кремовый:255,248,225;Светло-серый:200,200,200;Серый:128,128,128;Тёмно-серый:70,70,70;Чёрный:10,10,10;Красный:220,30,30;Тёмно-красный:140,20,25;Бордовый:110,15,40;Алый:255,36,0;Розовый:255,150,190;Ярко-розовый:255,50,140;Малиновый:200,20,90;Оранжевый:255,140,0;Светло-оранжевый:255,190,110;Персиковый:255,200,160;Коралловый:255,110,90;Лососевый:250,150,130;Терракотовый:200,95,60;Жёлтый:255,225,0;Светло-жёлтый:255,245,160;Золотой:230,180,30;Горчичный:205,165,30;Бежевый:225,205,170;Песочный:220,190,130;Светло-коричневый:170,120,70;Коричневый:120,72,35;Тёмно-коричневый:70,40,20;Хаки:150,150,80;Оливковый:110,115,35;Лаймовый:190,235,40;Салатовый:150,230,100;Светло-зелёный:150,215,150;Зелёный:40,170,60;Тёмно-зелёный:15,90,40;Изумрудный:20,160,120;Мятный:160,235,205;Бирюзовый:30,200,200;Тёмно-бирюзовый:0,110,120;Голубой:130,200,250;Небесно-голубой:100,170,230;Серо-голубой:110,130,150;Синий:30,80,220;Васильковый:90,120,230;Тёмно-синий:15,30,100;Индиго:70,40,150;Фиолетовый:130,50,190;Сиреневый:190,150,220;Лавандовый:215,200,240;Пурпурный:170,30,150".split(";").map(s=>{const[n,c]=s.split(":"),rgb=c.split(",").map(Number);return{n,lab:lab(rgb)}});
function lab(c){let[r,g,b]=c.map(v=>{v/=255;return v>.04045?Math.pow((v+.055)/1.055,2.4):v/12.92});const x=(r*.4124+g*.3576+b*.1805)/.95047,y=r*.2126+g*.7152+b*.0722,z=(r*.0193+g*.1192+b*.9505)/1.08883,f=t=>t>.008856?Math.cbrt(t):7.787*t+16/116;return[116*f(y)-16,500*(f(x)-f(y)),200*(f(y)-f(z))]}
function nameOf(rgb){const l=lab(rgb);let best=null,bd=1e9;for(const c of NAMES){const d=(c.lab[0]-l[0])**2+(c.lab[1]-l[1])**2+(c.lab[2]-l[2])**2;if(d<bd){bd=d;best=c.n}}return best}
const hex=c=>"#"+c.map(v=>v.toString(16).padStart(2,"0")).join("").toUpperCase();
const vid=$("#vid"),cv=$("#cv"),cx=cv.getContext("2d",{willReadFrequently:true}),stage=$("#stage"),frame=$("#frame");
let stream=null,cur=null,sel=-1,facing="environment",tab="cam";
async function startCam(){stopCam();try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1280}},audio:false});vid.srcObject=stream;$("#err").hidden=true}catch(e){$("#err").hidden=false}}
function stopCam(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null}
function setMode(m){stage.dataset.mode=m;$("#shutter").classList.toggle("retake",m==="photo");$("#hint").hidden=m!=="photo";layout()}
function layout(){if(!cv.width)return;const r=stage.getBoundingClientRect(),s=Math.min(r.width/cv.width,r.height/cv.height);frame.style.width=cv.width*s+"px";frame.style.height=cv.height*s+"px";frame.style.margin=`${-cv.height*s/2}px 0 0 ${-cv.width*s/2}px`}
addEventListener("resize",layout);
function fit(w,h){const k=Math.min(1,900/Math.max(w,h));cv.width=Math.round(w*k);cv.height=Math.round(h*k)}
function newShot(){cur={id:Date.now(),picks:[],img:cv.toDataURL("image/jpeg",.72)};sel=-1;marks();setMode("photo");hideSheet();$("#flash").classList.remove("go");void $("#flash").offsetWidth;$("#flash").classList.add("go")}
$("#shutter").onclick=()=>{if(stage.dataset.mode==="photo"){cur=null;sel=-1;marks();hideSheet();setMode("live");startCam();return}
 const w=vid.videoWidth,h=vid.videoHeight;if(!w)return toast("Камера ещё не готова");fit(w,h);cx.drawImage(vid,0,0,cv.width,cv.height);newShot()};
$("#flip").onclick=()=>{facing=facing==="environment"?"user":"environment";if(stage.dataset.mode==="live")startCam()};
$("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{fit(im.naturalWidth,im.naturalHeight);cx.drawImage(im,0,0,cv.width,cv.height);stopCam();newShot();URL.revokeObjectURL(im.src)};im.src=URL.createObjectURL(f);e.target.value=""};
frame.onclick=e=>{if(!cur)return;const r=frame.getBoundingClientRect(),fx=(e.clientX-r.left)/r.width,fy=(e.clientY-r.top)/r.height;if(fx<0||fy<0||fx>1||fy>1)return;
 const px=Math.min(cv.width-1,Math.round(fx*cv.width)),py=Math.min(cv.height-1,Math.round(fy*cv.height)),x0=Math.max(0,px-4),y0=Math.max(0,py-4),w=Math.min(9,cv.width-x0),h=Math.min(9,cv.height-y0),d=cx.getImageData(x0,y0,w,h).data;let s=[0,0,0],n=w*h;for(let i=0;i<n;i++){s[0]+=d[i*4];s[1]+=d[i*4+1];s[2]+=d[i*4+2]}
 const rgb=s.map(v=>Math.round(v/n));cur.picks.push({x:fx,y:fy,rgb,name:nameOf(rgb)});sel=cur.picks.length-1;persist();marks();showSheet()};
function marks(){const m=$("#marks");m.innerHTML="";(cur?cur.picks:[]).forEach((p,i)=>{const d=document.createElement("div");d.className="mk"+(i===sel?" sel":"");d.style.cssText=`left:${p.x*100}%;top:${p.y*100}%;background:rgb(${p.rgb})`;d.onclick=e=>{e.stopPropagation();sel=i;marks();showSheet()};m.appendChild(d)})}
function showSheet(){const p=cur.picks[sel];$("#sw").style.background=`rgb(${p.rgb})`;$("#nm").textContent=p.name;$("#vals").textContent=`RGB ${p.rgb.join(", ")}  ·  ${hex(p.rgb)}`;const c=$("#chips");c.innerHTML="";cur.picks.forEach((q,i)=>{const b=document.createElement("button");b.className="chip"+(i===sel?" sel":"");b.style.background=`rgb(${q.rgb})`;b.setAttribute("aria-label",q.name);b.onclick=()=>{sel=i;marks();showSheet()};c.appendChild(b)});$("#sheet").classList.add("up")}
function hideSheet(){$("#sheet").classList.remove("up")}
$("#copy").onclick=async()=>{const p=cur.picks[sel],t=`${p.name}: RGB(${p.rgb.join(", ")}) ${hex(p.rgb)}`;try{await navigator.clipboard.writeText(t);toast("Скопировано")}catch(e){toast(t)}};
function load(){try{return JSON.parse(localStorage.getItem("colorlens")||"[]")}catch(e){return[]}}
function save(a){while(true){try{localStorage.setItem("colorlens",JSON.stringify(a));return true}catch(e){if(!a.length){toast("Не удалось сохранить");return false}a.pop()}}}
function persist(){const a=load(),i=a.findIndex(h=>h.id===cur.id);if(i<0)a.unshift(cur);else a[i]=cur;save(a)}
const fmt=id=>new Date(id).toLocaleString("ru-RU",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
function renderHis(){const a=load(),g=$("#grid");g.innerHTML="";$("#empty").hidden=a.length>0;$("#clear").hidden=!a.length;$("#hsub").textContent=a.length?`Снимков: ${a.length}`:"";
 a.forEach(h=>{const c=document.createElement("div");c.className="hc glass";c.innerHTML=`<div class="ph" style="background-image:url(${h.img})"></div><button class="del glass" aria-label="Удалить">×</button><div class="in"><div class="dt">${fmt(h.id)}</div><div class="sws">${h.picks.slice(0,6).map(p=>`<i style="background:rgb(${p.rgb})"></i>`).join("")}</div><div class="nms">${[...new Set(h.picks.map(p=>p.name))].slice(0,3).join(", ")}</div></div>`;
 c.onclick=()=>openEntry(h);c.querySelector(".del").onclick=e=>{e.stopPropagation();save(load().filter(x=>x.id!==h.id));renderHis()};g.appendChild(c)})}
$("#clear").onclick=()=>{if(confirm("Удалить все снимки и результаты?")){save([]);renderHis()}};
function openEntry(h){const im=new Image();im.onload=()=>{cv.width=im.naturalWidth;cv.height=im.naturalHeight;cx.drawImage(im,0,0);cur=h;sel=h.picks.length-1;go("cam");setMode("photo");marks();sel>=0?showSheet():hideSheet()};im.src=h.img}
function go(t){tab=t;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===t));$("#v-cam").classList.toggle("on",t==="cam");$("#v-his").classList.toggle("on",t==="his");
 if(t==="his"){stopCam();renderHis();hideSheet()}else{if(stage.dataset.mode==="live")startCam();else if(cur&&sel>=0)showSheet();layout()}}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>go(b.dataset.t));
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2000)}
startCam();
</script>
</body>
</html>
